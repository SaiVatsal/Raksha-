[package]
name = "raksha"
version = "0.1.0"
edition = "2021"
authors = ["Raksha Security Systems"]
description = "Ultra-lightweight, high-performance Windows anti-malware engine and real-time shield"
license = "Apache-2.0"

[lib]
name = "raksha"
path = "src/lib.rs"

[[bin]]
name = "raksha"
path = "src/main.rs"

[[bin]]
name = "raksha-tray"
path = "src/bin/raksha_tray.rs"

[[bin]]
name = "raksha-setup"
path = "src/bin/raksha_setup.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
goblin = "0.10"
sha2 = "0.10"
hex = "0.4"
aho-corasick = "1.1"
notify = "6.1"
walkdir = "2.5"
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
tray-icon = "0.26"
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi"
] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
